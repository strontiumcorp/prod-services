#Shared global config
x-redis-common: &redis-common
  image: ${REDIS_IMAGE:-redis:8.8.0-alpine}
  init: true
  command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
  healthcheck:
    test:
      [
        "CMD-SHELL",
        "REDISCLI_AUTH=$$(awk '/^requirepass / {print $$2; exit}' /usr/local/etc/redis/redis.conf) redis-cli -h 127.0.0.1 -p 6379 ping | grep -q PONG",
      ]
    interval: 10s
    timeout: 3s
    retries: 6
    start_period: 20s
  restart: unless-stopped
  stop_grace_period: ${REDIS_STOP_GRACE_PERIOD:-30s}
  pids_limit: ${REDIS_PIDS_LIMIT:-4096}
  read_only: true
  tmpfs:
    - /tmp:size=64m,noexec,nosuid,nodev
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: ${REDIS_LOG_MAX_SIZE:-100m}
      max-file: "${REDIS_LOG_MAX_FILE:-5}"
  ulimits:
    nofile:
      soft: 65536
      hard: 65536

#Shared service specific config
x-redis-config-bind:
  cache: &redis-cache-config
    type: bind
    source: ./redis_config/cache.conf
    target: /usr/local/etc/redis/redis.conf
    read_only: true
    bind:
      create_host_path: false
  ws: &redis-ws-config
    type: bind
    source: ./redis_config/ws.conf
    target: /usr/local/etc/redis/redis.conf
    read_only: true
    bind:
      create_host_path: false
  session: &redis-session-config
    type: bind
    source: ./redis_config/session.conf
    target: /usr/local/etc/redis/redis.conf
    read_only: true
    bind:
      create_host_path: false
  queue: &redis-queue-config
    type: bind
    source: ./redis_config/queue.conf
    target: /usr/local/etc/redis/redis.conf
    read_only: true
    bind:
      create_host_path: false

services:
  redis-cache:
    <<: *redis-common
    container_name: ${REDIS_CACHE_CONTAINER_NAME:-redis-cache}
    ports:
      - "${REDIS_BIND_ADDRESS:-127.0.0.1}:${REDIS_CACHE_HOST_PORT:-6379}:6379"
    mem_limit: ${REDIS_CACHE_MEM_LIMIT:?Run make config redis}
    volumes:
      - type: bind
        source: ${REDIS_CACHE_DATA_DIR:-./data/cache}
        target: /data
        bind:
          create_host_path: false
      - *redis-cache-config

  redis-ws:
    <<: *redis-common
    container_name: ${REDIS_WS_CONTAINER_NAME:-redis-ws}
    ports:
      - "${REDIS_BIND_ADDRESS:-127.0.0.1}:${REDIS_WS_HOST_PORT:-6382}:6379"
    mem_limit: ${REDIS_WS_MEM_LIMIT:?Run make config redis}
    volumes:
      - type: bind
        source: ${REDIS_WS_DATA_DIR:-./data/ws}
        target: /data
        bind:
          create_host_path: false
      - *redis-ws-config

  redis-session:
    <<: *redis-common
    container_name: ${REDIS_SESSION_CONTAINER_NAME:-redis-session}
    ports:
      - "${REDIS_BIND_ADDRESS:-127.0.0.1}:${REDIS_SESSION_HOST_PORT:-6380}:6379"
    mem_limit: ${REDIS_SESSION_MEM_LIMIT:?Run make config redis}
    volumes:
      - type: bind
        source: ${REDIS_SESSION_DATA_DIR:-./data/session}
        target: /data
        bind:
          create_host_path: false
      - *redis-session-config

  redis-queue:
    <<: *redis-common
    container_name: ${REDIS_QUEUE_CONTAINER_NAME:-redis-queue}
    ports:
      - "${REDIS_BIND_ADDRESS:-127.0.0.1}:${REDIS_QUEUE_HOST_PORT:-6381}:6379"
    mem_limit: ${REDIS_QUEUE_MEM_LIMIT:?Run make config redis}
    volumes:
      - type: bind
        source: ${REDIS_QUEUE_DATA_DIR:-./data/queue}
        target: /data
        bind:
          create_host_path: false
      - *redis-queue-config
